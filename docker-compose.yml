# Local development database only. The API and web app run natively (see README / Makefile)
# so you get hot reload and debuggers.
#
# The explicit project name keeps this stack separate from any other compose project on the
# machine (the default name is the directory name, which would collide with another "mula"
# project and let `down -v` delete ITS volume).
name: mula-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mula
      POSTGRES_PASSWORD: mula
      POSTGRES_DB: mula
    ports:
      # 127.0.0.1 only: this dev DB uses a throwaway password and must not be LAN-reachable.
      # 15432 (not 5432) so it never clashes with a Postgres you already run.
      - "127.0.0.1:15432:5432"
    volumes:
      - mula_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mula -d mula"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mula_dev_pg:
